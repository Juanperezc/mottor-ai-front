openapi: 3.1.0
info:
  title: Mottor AI API
  version: 0.1.0-draft
  summary: Quotes MVP API contract (spec 001-quotes-mvp). Source of truth between mottor-ai-back and mottor-ai-front.
  description: |
    Status: DRAFT. Based on docs/api-contract-draft.md (v0, MAI - Architect, 2026-10-28).
    The official challenge statement is not available yet; every assumption is tagged with
    `[NEEDS CLARIFICATION: ...]` in its description.

    Conventions:
    - JSON bodies use camelCase. Dates use ISO 8601 (`YYYY-MM-DD`), timestamps use RFC 3339.
    - Money amounts are decimal strings (e.g. "1234.50"); exchange rates are decimal strings with 6 decimals.
      The backend computes with bcmath/integers, never float.
    - Validation errors: 422 Laravel format `{ message, errors }`. Other errors: `{ message }`.
    - Additions to draft v0 are marked with `x-proposed: true` and must be confirmed.
servers:
  - url: http://localhost:8000/api
    description: Local development
tags:
  - name: currencies
  - name: clients
  - name: quotes
  - name: tickets
  - name: imports
paths:
  /currencies:
    get:
      tags: [currencies]
      operationId: listCurrencies
      summary: List supported currencies
      description: "Seeded in DB, not hardcoded in the frontend. Default USD. [NEEDS CLARIFICATION: which currencies the challenge requires (Q1)]"
      responses:
        '200':
          description: Supported currencies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Currency' }
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: Search clients (server-side, paginated)
      description: "Used by the single-select client filter. [NEEDS CLARIFICATION: expected number of clients; single vs multi-select (Q12)]"
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on client name.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated clients
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientRef' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quotes:
    get:
      tags: [quotes]
      operationId: listQuotes
      summary: List quotes (paginated, ordered by date desc)
      description: "[NEEDS CLARIFICATION: default order and column sorting (Q13)]"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: clientId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: Paginated quotes with amounts converted to the requested currency
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/QuoteSummary' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quotes/{quoteId}:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    get:
      tags: [quotes]
      operationId: getQuote
      summary: Get quote detail with items and ordered applied rules
      parameters:
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: Quote detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/QuoteDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quotes/{quoteId}/ticket:
    parameters:
      - $ref: '#/components/parameters/QuoteId'
    get:
      tags: [tickets]
      operationId: getQuoteTicket
      summary: Get the editable ticket and its rendered fixed-width version
      description: "[NEEDS CLARIFICATION: scope of the ticket editor (free header/footer vs template with placeholders), format and width (Q11)]"
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tickets]
      operationId: updateQuoteTicket
      summary: Update ticket header/footer (plain text, persisted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdate' }
      responses:
        '200':
          description: Updated ticket with new rendered output
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports:
    post:
      tags: [imports]
      operationId: createImport
      summary: Upload a dataset file and enqueue its processing
      description: "JSON array of quotes with nested items, max 20 MB. CSV is out of scope for v1. [NEEDS CLARIFICATION: dataset format and schema (Q7)]"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/json
                  description: Dataset file (.json, max 20 MB). See components.schemas.DatasetFile.
      responses:
        '202':
          description: Import accepted and queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Import' }
        '409':
          description: "Another import is already running. [NEEDS CLARIFICATION: are concurrent imports allowed?]"
          x-proposed: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [imports]
      operationId: getImport
      summary: Get import progress (polled every 1 s by the frontend)
      responses:
        '200':
          description: Import status and counters
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Import' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{importId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [imports]
      operationId: cancelImport
      summary: Stop pending batches (no rollback of already imported rows)
      description: "[NEEDS CLARIFICATION: is cancel a requirement? (Q8)]"
      responses:
        '200':
          description: Import marked as cancelled (or cancelling)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Import' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Import already finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /imports/{importId}/errors:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [imports]
      operationId: listImportErrors
      summary: Paginated per-row validation errors
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Row errors ordered by row number
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ImportRowError' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: perPage
      in: query
      required: false
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
    Currency:
      name: currency
      in: query
      required: false
      description: "Display currency (ISO 4217). Amounts are converted by the backend. Defaults to USD. [NEEDS CLARIFICATION: convert vs filter by original currency (Q2)]"
      schema: { $ref: '#/components/schemas/CurrencyCode' }
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation error (Laravel format)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
  schemas:
    Decimal:
      type: string
      description: Decimal amount as string, never a JSON number. Scale per currency (`decimals`).
      pattern: '^-?\d+(\.\d+)?$'
      examples: ['1234.50', '-1240.00']
    Rate:
      type: string
      description: Exchange rate as decimal string with 6 decimals.
      pattern: '^\d+\.\d{6}$'
      examples: ['0.001050']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: ['USD']
    Currency:
      type: object
      required: [code, name, symbol, decimals]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        name: { type: string, examples: ['US Dollar'] }
        symbol: { type: string, examples: ['$'] }
        decimals: { type: integer, minimum: 0, maximum: 4, examples: [2] }
    ClientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    PaginationMeta:
      type: object
      x-proposed: true
      description: "Pagination envelope (not defined in draft v0)."
      required: [currentPage, perPage, total, lastPage]
      properties:
        currentPage: { type: integer, minimum: 1 }
        perPage: { type: integer }
        total: { type: integer, minimum: 0 }
        lastPage: { type: integer, minimum: 1 }
    QuoteSummary:
      type: object
      required: [id, code, date, client, eventDescription, originalCurrency, displayCurrency, exchangeRate, exchangeRateDate, subtotal, total]
      properties:
        id: { type: integer, examples: [1] }
        code: { type: string, examples: ['Q-000123'] }
        date: { type: string, format: date }
        client: { $ref: '#/components/schemas/ClientRef' }
        eventDescription:
          type: string
          description: "Multiline text; line breaks preserved (\\n). [NEEDS CLARIFICATION: is the first line the event title or is there a separate title field? (Q4)]"
          examples: ["Conferencia anual 2026\nSalón principal, catering y AV para 300 personas"]
        itemsCount:
          type: integer
          minimum: 0
          x-proposed: true
          description: Number of items (shown in the dashboard Items column per design.md).
        originalCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        displayCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        exchangeRate: { $ref: '#/components/schemas/Rate' }
        exchangeRateDate:
          type: string
          format: date
          description: "[NEEDS CLARIFICATION: rate date = quote date or current date (Q2)]"
        subtotal: { $ref: '#/components/schemas/Decimal' }
        total: { $ref: '#/components/schemas/Decimal' }
    QuoteItem:
      type: object
      required: [id, description, quantity, unitPrice, lineTotal]
      properties:
        id: { type: integer }
        description: { type: string }
        quantity:
          type: string
          description: "Decimal string. [NEEDS CLARIFICATION: integer quantities only?]"
          pattern: '^\d+(\.\d+)?$'
          examples: ['300']
        unitPrice: { $ref: '#/components/schemas/Decimal' }
        lineTotal: { $ref: '#/components/schemas/Decimal' }
    RuleType:
      type: string
      description: "Initial strategies (extensible without touching the engine, OCP). [NEEDS CLARIFICATION: final rule catalog (Q10)]"
      enum: [percentage_discount, fixed_discount, percentage_surcharge, fixed_fee, tax]
    AppliedRule:
      type: object
      description: One step of the rule pipeline. Ordered by application priority; the UI must not recalculate.
      required: [order, code, name, type, base, delta, runningTotal]
      properties:
        order: { type: integer, minimum: 1 }
        code: { type: string, examples: ['VOLUME_10'] }
        name: { type: string, examples: ['Descuento por volumen 10%'] }
        type: { $ref: '#/components/schemas/RuleType' }
        base: { $ref: '#/components/schemas/Decimal' }
        delta:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: Signed amount; negative = discount, positive = surcharge, "0.00" = no effect.
        runningTotal: { $ref: '#/components/schemas/Decimal' }
    QuoteDetail:
      allOf:
        - $ref: '#/components/schemas/QuoteSummary'
        - type: object
          required: [items, appliedRules]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QuoteItem' }
            appliedRules:
              type: array
              description: Ordered by `order`. Last `runningTotal` equals `total`; empty array means total == subtotal.
              items: { $ref: '#/components/schemas/AppliedRule' }
    Ticket:
      type: object
      required: [header, footer, width, rendered]
      properties:
        header: { type: string, maxLength: 500 }
        footer: { type: string, maxLength: 500 }
        width: { type: integer, const: 40, description: "Columns. [NEEDS CLARIFICATION: 32/40/48 (Q11)]" }
        rendered:
          type: string
          description: Full plain-text ticket rendered by the backend at `width` columns, lines separated by \n.
    TicketUpdate:
      type: object
      required: [header, footer]
      additionalProperties: false
      properties:
        header: { type: string, maxLength: 500 }
        footer: { type: string, maxLength: 500 }
    ImportStatus:
      type: string
      enum: [queued, processing, completed, completed_with_errors, failed, cancelled]
    Import:
      type: object
      required: [id, status, totalRows, processedRows, importedRows, failedRows]
      properties:
        id: { type: integer }
        status: { $ref: '#/components/schemas/ImportStatus' }
        totalRows: { type: integer, minimum: 0 }
        processedRows: { type: integer, minimum: 0 }
        importedRows: { type: integer, minimum: 0 }
        failedRows: { type: integer, minimum: 0 }
        batchSize: { type: integer, x-proposed: true, examples: [500] }
        totalBatches: { type: integer, minimum: 0, x-proposed: true, description: Needed by BatchProgress ("Batch 7 de 10"). }
        processedBatches: { type: integer, minimum: 0, x-proposed: true }
        failureReason: { type: [string, 'null'], x-proposed: true, description: Set when status = failed (corrupt file, invalid schema). }
        startedAt: { type: [string, 'null'], format: date-time, x-proposed: true }
        finishedAt: { type: [string, 'null'], format: date-time, x-proposed: true }
    ImportRowError:
      type: object
      required: [row, field, message, value]
      properties:
        row: { type: integer, minimum: 1, description: 1-based index in the dataset array. }
        batch: { type: integer, minimum: 1, x-proposed: true }
        field: { type: [string, 'null'], examples: ['items[2].unitPrice'] }
        message: { type: string }
        value: { type: [string, 'null'], description: Offending value serialized as string. }
    DatasetFile:
      type: array
      description: "Schema of the uploaded JSON file. [NEEDS CLARIFICATION: official dataset schema; do rows include rules or precomputed totals? Duplicate code policy? (Q7)]"
      items:
        type: object
        required: [code, date, client, eventDescription, currency, items]
        properties:
          code: { type: string }
          date: { type: string, format: date }
          client: { type: string, description: Client name; created if missing. }
          eventDescription: { type: string }
          currency: { $ref: '#/components/schemas/CurrencyCode' }
          items:
            type: array
            minItems: 1
            items:
              type: object
              required: [description, quantity, unitPrice]
              properties:
                description: { type: string }
                quantity: { type: string, pattern: '^\d+(\.\d+)?$' }
                unitPrice: { $ref: '#/components/schemas/Decimal' }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
